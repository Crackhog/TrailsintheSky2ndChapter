
name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore ./TrailsintheSky2ndChapter.slnx

      - name: Build
        run: dotnet build ./TrailsintheSky2ndChapter.slnx --configuration Release --no-restore
